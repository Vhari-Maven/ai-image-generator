[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "ai-art-generator"
version = "0.1.0"
description = "AI art generation CLI with chroma-key background removal pipeline"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.20.0",
    "openai>=1.88.0",
    "pillow>=11.2.1",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.4",
    "tqdm>=4.67.1",
]

[project.scripts]
art-generator = "art_generator:main"
prompts-from-image = "prompts_from_image:main"
art-generator-remove-bg = "postprocess.remove_bg_cli:main"
art-generator-slice = "postprocess.slice_cli:main"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
]
# Background removal post-processing. Heavy deps (~50MB onnxruntime + ~180MB
# model on first use), so kept out of the base install for lean extraction
# to a standalone repo. Listed under tool.uv.default-groups so in-tree
# `uv sync` here installs it automatically — extracted users opt in.
bg-removal = [
    "rembg[cpu]>=2.0.59",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    # pymatting is also pulled in transitively by rembg's alpha-matting
    # path, but we depend on it directly for foreground decontamination
    # (estimate_foreground_ml), so declare it explicitly.
    "pymatting>=1.1.15",
    # scipy likewise arrives transitively, but remove_bg.py imports
    # scipy.ndimage directly (boundary cleanup, pocket diagnostic).
    "scipy>=1.11",
]

[tool.uv]
default-groups = ["dev", "bg-removal"]
